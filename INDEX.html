<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
   <header>
    <div class="tittle-bar">
       <img src="./next_16569915.png" alt="" class="tittle-img">
       <h1 class="tittle-text">VLCMediaPlayer</h1>
    </div>
    <div class="menu-bar">
        <div class="menu">
            <div class="menu-btn" id="vidbtn">open</div>
            <input type="file" class="vid-input" >
        </div>
        <div class="menu">
            <div class="menu-btn">playback
                <ul class="menu-play">
                    <li id="speedup">speed up</li>
                    <li id="speeddown">speed down</li>
                </ul>
            </div>
        </div>
        <div class="menu">
            <div class="menu-btn">audio</div>
            <ul class="menu-play">
                <li id="volup">vol up</li>
                <li id="voldown">vol down</li>
            </ul>
        </div>
    </div>
   </header>
   <main id="vidplay">
    <div class="toast">
        100%
    </div>
   </main>
   <footer></footer>

    
</body>
<script src="intro.js"></script>
</html>
